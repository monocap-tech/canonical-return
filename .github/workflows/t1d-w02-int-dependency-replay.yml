name: W02 INT EP and BO exact dependency replay
on:
  push:
    branches: [research/cr-int-t1d-ep-targeted-corrector-staged]
    paths: [.github/workflows/t1d-w02-int-dependency-replay.yml]
permissions:
  contents: write
jobs:
  dependency-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            custody/ep/full-reoptimization
      - uses: actions/checkout@v4
        with:
          ref: 36579dfa51c81e43ebce1ead4771eb3a3dd52af3
          path: bo-source
          sparse-checkout: |
            custody/T1D-archives/parts/CR-INT-T1D-BO-reproducibility.zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exact archive and frozen-center replay
        run: |
          python -m pip install numpy==2.3.5
          mkdir -p custody/w02-int/dependency-replay
          python - <<'PY'
          import hashlib, json, pathlib, zipfile, io, subprocess, os, sys, traceback
          from fractions import Fraction
          P=pathlib.Path
          out=P('custody/w02-int/dependency-replay')
          ep=P('custody/ep/full-reoptimization')
          def sha(b): return hashlib.sha256(b).hexdigest()
          def gitsha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def check(z,m,extras=()):
              assert len(z.namelist())==len(set(z.namelist()))
              assert z.testzip() is None
              expected={x['name'] for x in m['files']}|{'MANIFEST.json'}|set(extras)
              assert set(z.namelist())==expected, (sorted(z.namelist()), sorted(expected))
              for f in m['files']:
                  b=z.read(f['name'])
                  assert len(b)==f['size'] and sha(b)==f['sha256'], f['name']
          receipt={'status':'INCOMPLETE','source_commit':os.environ['GITHUB_SHA'],'bo_source_commit':'36579dfa51c81e43ebce1ead4771eb3a3dd52af3','scope':'dependency bytes and exact frozen numerical centers only; no physical acceptance','python':sys.version}
          def save(): (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          try:
              b=(ep/'EP-full-reoptimization-custody-ready.zip').read_bytes()
              assert len(b)==11921119 and gitsha(b)=='eec729bb675e436d0b982b9d7b21b68a04310a10'
              assert sha(b)=='89b16e4250bf3b0a261cf6ff54863ef32c7d415d956a89240d455434a3cf8d73'
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  m=json.loads(z.read('MANIFEST.json'))
                  assert m==json.loads((ep/'MANIFEST.json').read_bytes())
                  check(z,m,('README.txt',))
                  receipt['outer_readme']={'bytes':len(z.read('README.txt')),'sha256':sha(z.read('README.txt')),'authentication':'covered by exact pinned outer archive SHA256'}
                  ib=z.read('EP-full-reoptimization-provisional.zip')
                  assert sha(ib)=='6b469aeeb5d86db79215700a8f687a54053c7b2908f90fbbb1f1e7895c22ab77'
                  assert gitsha(ib)=='bcc2be3b4308ccc612bb0f02b2f83db0f215d88d'
                  assert z.read('ep_frozen_center_audit.py')==(ep/'ep_frozen_center_audit.py').read_bytes()
                  assert z.read('EP-frozen-center-audit.json')==(ep/'EP-frozen-center-audit.json').read_bytes()
              with zipfile.ZipFile(io.BytesIO(ib)) as z:
                  im=json.loads(z.read('MANIFEST.json'))
                  assert im==json.loads((ep/'INNER-MANIFEST.json').read_bytes())
                  check(z,im)
              receipt['EP']={'sha256':sha(b),'git_blob':gitsha(b),'outer_payloads':len(m['files']),'inner_sha256':sha(ib),'inner_payloads':len(im['files']),'CRC':'PASS','manifest':'PASS'}
              save()
              parts=sorted(P('bo-source/custody/T1D-archives/parts/CR-INT-T1D-BO-reproducibility.zip').glob('part-*.bin'))
              assert [p.name for p in parts]==[f'part-{i:04d}.bin' for i in range(22)]
              bb=b''.join(p.read_bytes() for p in parts)
              assert sha(bb)=='de9ed042d12afda71513b8110d0cf10cab84451e20aa4e7546d9dde2dfb54fb4'
              required={'odd_joint.npz','odd_overlap.npz','bo_lifts.py','bo_joint.py','bn_energy.py'}
              with zipfile.ZipFile(io.BytesIO(bb)) as z:
                  assert z.testzip() is None
                  def member(name):
                      matches=[n for n in z.namelist() if P(n).name==name]
                      assert len(matches)==1,(name,matches)
                      return matches[0]
                  manifest=z.read(member('bo_sha256.txt')).decode()
                  records={}
                  for line in manifest.splitlines():
                      if not line.strip(): continue
                      fields=line.split(maxsplit=1)
                      if len(fields)==2 and len(fields[0])==64:
                          name=P(fields[1].lstrip('*')).name
                          if name in required:
                              assert name not in records
                              records[name]=fields[0]
                  assert set(records)==required,records
                  actual={}
                  for n in sorted(required):
                      payload=z.read(member(n))
                      assert sha(payload)==records[n],n
                      actual[n]={'bytes':len(payload),'sha256':sha(payload)}
                  assert actual['odd_joint.npz']['sha256']=='385a26a58a05ab1abd0d6556546ee0a30e0d4e0ff9fceb18660a6bc34d546b98'
                  assert actual['odd_overlap.npz']['sha256']=='a619e1590c1b2cd108227ec40979656b2d73bca67851e2b6187860175480e037'
              receipt['BO']={'archive_sha256':sha(bb),'archive_bytes':len(bb),'parts':len(parts),'CRC':'PASS','required_manifest_payloads':actual}
              save()
              tmp=P(os.environ['RUNNER_TEMP'])/'EP-full-reoptimization-provisional.zip'
              tmp.write_bytes(ib)
              subprocess.run([sys.executable,str(ep/'ep_frozen_center_audit.py'),str(tmp),str(out/'center-replay.json')],check=True)
              replay=json.loads((out/'center-replay.json').read_text())
              assert replay['archive_sha256']==sha(ib) and replay['manifest_payloads']==9
              assert [x['coordinates'] for x in replay['results']]==[384,500]
              for x,t in zip(replay['results'],[Fraction(27,10**7),Fraction(39,10**7)]):
                  assert Fraction(x['exact_center_lower'])==t and x['congruence_min_margin']>0
              assert Fraction(replay['results'][1]['trial_operator_norm_upper'])<=Fraction(61877125,10**9)
              receipt['status']='PASS'
              save()
          except Exception as exc:
              receipt['error']=repr(exc)
              receipt['traceback']=traceback.format_exc()
              save()
              raise
          PY
      - name: Persist exact replay evidence
        if: always()
        run: |
          mkdir -p custody/w02-int/dependency-replay
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-w02-dependency-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add --sparse -f custody/w02-int/dependency-replay/
          git commit -m "W02 INT exact dependency replay evidence run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w02-int-dependency-replay
          path: custody/w02-int/dependency-replay/
