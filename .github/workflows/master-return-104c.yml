name: RETURN104-C exact integer finite source contraction replay
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-104c/**'
      - '.github/workflows/master-return-104c.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONINTMAXSTRDIGITS: '0'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original reproduction and RETURN087 audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -oq "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          unzip -oq "$RUNNER_TEMP/archives/RETURN087_audit.zip" -d "$RUNNER_TEMP/work"
          python -m pip install python-flint==0.8.0 numpy==2.2.6
          python -m py_compile research/master-return-104c/exact_finite.py
      - name: Replay original finite contractions with exact FLINT integer multiplication
        run: python research/master-return-104c/exact_finite.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return104c-exact-integer-finite-contractions
          path: ${{ runner.temp }}/results/
