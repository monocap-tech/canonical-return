name: T1D EO matched 368-corrector numerical spectrum screen
on:
  push:
    branches: [research/cr-int-t1d-eo-extended-spectrum-active]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify EN success and literal permanent evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45906138221 > /tmp/en-run.json
          attempt=$(python - <<'PY'
          import json
          r=json.load(open('/tmp/en-run.json'))
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='2ac315744ddab5f2eda2b07e5acd0d9db57ebc4d'
          print(r['run_attempt'])
          PY
          )
          git fetch --no-tags --depth=1 origin "refs/heads/research/cr-int-t1d-en-evidence-45906138221-$attempt"
          test "$(git rev-parse FETCH_HEAD:custody/en/generated)" = "$(git rev-parse HEAD:custody/en/generated)"
          (cd custody/en/generated && sha256sum -c sha256.txt)
      - name: Static source preflight
        run: |
          python - <<'PY'
          import ast, pathlib, json
          p=pathlib.Path('custody/eo/screen.py')
          ast.parse(p.read_text(),filename=str(p))
          a=json.loads(pathlib.Path('custody/ej/generated/audit.json').read_text())
          assert a['best_margin_audited'] and a['columns']==31
          e=json.loads(pathlib.Path('custody/en/generated/extension.json').read_text())
          assert e['physical_columns']==368 and e['physical_support']==507
          assert e['cutoff']==65536 and e['new_rows']==32768 and e['new_columns']==16
          assert e['old_energy_overlap'] and e['old_action_reused'] and len(e['physical_blocks'])==20
          print('EO SOURCE PREFLIGHT PASS')
          PY
      - name: Install numerical environment
        run: |
          mkdir -p custody/eo/generated
          python -m pip install numpy==2.3.5 scipy==1.17.0
          (cd custody/eo && python -c "import select, subprocess; from scipy.sparse.linalg import cg; assert callable(select.select) and callable(cg); print('EO IMPORT REGRESSION PASS', select.__file__)")
          python --version > custody/eo/generated/python-version.txt
          python -m pip freeze > custody/eo/generated/pip-freeze.txt
      - name: Verify committed CF files and reconstruct original source
        run: |
          (cd custody/cf/generated && sha256sum -c sha256.txt)
          (cd custody/cg/generated && sha256sum -c sha256.txt)
          (cd custody/ch/generated && sha256sum -c sha256.txt)
          (cd custody/cj/generated && sha256sum -c sha256.txt)
          (cd custody/ck/generated && sha256sum -c sha256.txt)
          (cd custody/cl/generated && sha256sum -c sha256.txt)
          (cd custody/cm/generated && sha256sum -c sha256.txt)
          (cd custody/cn/generated && sha256sum -c sha256.txt)
          (cd custody/co/generated && sha256sum -c sha256.txt)
          (cd custody/cp/generated && sha256sum -c sha256.txt)
          (cd custody/cq/generated && sha256sum -c sha256.txt)
          (cd custody/cr/generated && sha256sum -c sha256.txt)
          (cd custody/cs/generated && sha256sum -c sha256.txt)
          (cd custody/ct/generated && sha256sum -c sha256.txt)
          (cd custody/cu/generated && sha256sum -c sha256.txt)
          (cd custody/cv/generated && sha256sum -c sha256.txt)
          (cd custody/cw/generated && sha256sum -c sha256.txt)
          (cd custody/cx/generated && sha256sum -c sha256.txt)
          (cd custody/cy/generated && sha256sum -c sha256.txt)
          (cd custody/cz/generated && sha256sum -c sha256.txt)
          (cd custody/da/generated && sha256sum -c sha256.txt)
          (cd custody/db/generated && sha256sum -c sha256.txt)
          (cd custody/dc/generated && sha256sum -c sha256.txt)
          (cd custody/de/generated && sha256sum -c sha256.txt)
          (cd custody/dg/generated && sha256sum -c sha256.txt)
          (cd custody/di/generated && sha256sum -c sha256.txt)
          (cd custody/dk/generated && sha256sum -c sha256.txt)
          (cd custody/dm/generated && sha256sum -c sha256.txt)
          (cd custody/dn/generated && sha256sum -c sha256.txt)
          (cd custody/dq/generated && sha256sum -c sha256.txt)
          (cd custody/ds/generated && sha256sum -c sha256.txt)
          (cd custody/du/generated && sha256sum -c sha256.txt)
          (cd custody/dv/generated && sha256sum -c sha256.txt)
          (cd custody/dx/generated && sha256sum -c sha256.txt)
          (cd custody/dy/generated && sha256sum -c sha256.txt)
          (cd custody/dz/generated && sha256sum -c sha256.txt)
          (cd custody/eb/generated && sha256sum -c sha256.txt)
          (cd custody/ec/generated && sha256sum -c sha256.txt)
          (cd custody/ed/generated && sha256sum -c sha256.txt)
          (cd custody/ee/generated && sha256sum -c sha256.txt)
          (cd custody/ef/generated && sha256sum -c sha256.txt)
          (cd custody/eg/generated && sha256sum -c sha256.txt)
          for stage in eh ei ej ek em en; do (cd custody/$stage/generated && sha256sum -c sha256.txt); done
          python custody/ce/reconstruct.py
          python - <<'PY'
          import csv
          def read(path):
              with open(path) as f: return {r.get('archive',r.get('name')):(int(r['bytes']),r['sha256']) for r in csv.DictReader(f,delimiter='\t')}
          assert read('custody/ce/evidence/archive-sha256.tsv')==read('ce-output/archive-verification.tsv')
          print('ALL 56 CE DIGESTS MATCH')
          PY
      - name: Verify recorded inherited paths
        run: python custody/recover_t1d_dependencies.py ce-output/archives ce-output/pristine --ledger custody/missing_inherited.tsv --report custody/eo/generated/recovery.tsv
      - name: Matched baseline and extended numerical screen
        run: |
          set -euo pipefail
          python custody/eo/screen.py | tee custody/eo/generated/screen.log
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np
          p=Path('custody/eo/generated')
          r=json.loads((p/'screen.json').read_text())
          assert r['physical_columns']==368 and r['physical_cutoff']==65536
          assert r['baseline_replay_error']<1e-7
          for k in ('ideal','best','best_positive_t'):
              assert all(math.isfinite(r[k][v]) for v in ('proxy31','proxy32','proxy33','nominal_on_trial32','hessian_min'))
              assert r[k]['hessian_min']>0
          assert r['best_positive_t']['t']>0
          for name,key in [('candidate32.npz','best'),('candidate32_positive_t.npz','best_positive_t')]:
              with np.load(p/name) as a:
                  assert a['X'].shape==(368,119) and a['Q'].shape==(119,32)
                  assert a['V'].ndim==2 and a['V'].shape[1]==119
                  assert all(np.isfinite(a[k]).all() for k in ('X','V','Q'))
                  assert all(float(a[k])==r[key][k] for k in ('delta','t','new_block_weight'))
          print('EO OUTPUT CONTRACT PASS (numerical only)')
          PY
      - name: Manifest and permanent evidence
        if: always()
        run: |
          mkdir -p custody/eo/generated
          (cd custody/eo/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-eo-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/eo/generated/
          if ! git diff --cached --quiet; then git commit -m "EO numerical spectrum evidence run ${GITHUB_RUN_ID}"; fi
          git push origin "HEAD:refs/heads/$branch"
      - name: Artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1d-eo-evidence
          path: custody/eo/generated/
          retention-days: 90
