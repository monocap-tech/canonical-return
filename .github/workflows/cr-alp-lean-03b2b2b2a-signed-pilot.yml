            test "$(git hash-object custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-46105441217-attempt-1/SignedGridSeries.log)" = ac2a2abf4c82c7c36139cfa91ba80a67fcd05466
            test "$(git hash-object custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-46105441217-attempt-1/signed-pilot.json)" = 976d53b498cc827aebdc91e218a7a9785c41e248
            test "$(git hash-object custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-46105441217-attempt-1/SignedPilot.lean)" = 904ae5133ccfc79804443c81f99fda8e57df9a7e
            test "$(git hash-object formalization/cr-alp/LEAN-03B2B2B2A-R1_REDTEAM.md)" = 152c170926c8992d1bc4f44ee2d15631174c750a
            python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('custody/cr-alp-lean-03b2a-log2-trace/run-46097300574-attempt-1/receipts.json').read_text())
          b=json.loads(Path('custody/cr-alp-lean-03b2b1-constant-traces/run-46099447047-attempt-1/receipts.json').read_text())
          assert a['status']=='NATIVE_LOG2_DIRECTED_TRACE_PASS' and a['trace_terms']==400
          assert b['status']=='NATIVE_CONSTANT_TRACES_PASS' and b['trace_terms']==1600
          assert all(v['status']=='PASS' and not v['issues'] for v in b['modules'].values())
          c=json.loads(Path('custody/cr-alp-lean-03b2b2a-prime-logs/run-46100522620-attempt-1/receipts.json').read_text())
          assert c['status']=='NATIVE_PRIME_LOG_TRACES_PASS' and c['new_trace_terms']==1600
          assert all(v['status']=='PASS' and not v['issues'] for v in c['modules'].values())
