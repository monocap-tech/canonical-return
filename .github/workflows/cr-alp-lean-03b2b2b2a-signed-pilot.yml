          assert g['status']=='NATIVE_LOG_PI_TRACE_PASS' and g['trace_terms']==400
          assert all(v['status']=='PASS' and not v['issues'] for v in g['modules'].values())
          print('Accepted native dependencies PASS')
          PY
          } 2>&1 | tee "$E/preflight.log"
          cp formalization/cr-alp/{AnalyticGuards,DirectedInterval,ElementarySeries,TrigSeries,DirectedEvaluation,RationalTrace,GridTrace,PrimeLogTrace,SignedGridSeries}.lean "$P/"
