          cp custody/cr-alp-lean-03b2b1-constant-traces/run-46099447047-attempt-1/{ConstAtan5,ConstAtan239,ConstPi}.lean "$P/"
          cp custody/cr-alp-lean-03b2b2a-prime-logs/run-46100522620-attempt-1/{PrimeLog3,PrimeLog5,PrimeLog7,PrimeLog9,PrimeLogs}.lean "$P/"
          cp formalization/cr-alp/{generate_signed_pilot.py,redteam_signed_pilot.js,LEAN-03B2B2B2A_REDTEAM.md} "$E/"
          cp custody/cr-alp-lean-02ar2-matrix-soundness/{lean-toolchain,lakefile.toml,lake-manifest.json} "$P/"
          cp "$P/"{lean-toolchain,lakefile.toml,lake-manifest.json} "$E/"
          printf '%s\n' "$GITHUB_SHA" > "$E/source-head.txt"
          python3 -m py_compile formalization/cr-alp/generate_signed_pilot.py
          node --check formalization/cr-alp/redteam_signed_pilot.js
          python3 formalization/cr-alp/generate_signed_pilot.py src/audits/cr_alp_046_full_finite.py "$P/" custody/cr-alp-lean-03b2b1-constant-traces/run-46099447047-attempt-1/constant-traces.json custody/cr-alp-lean-03b2b2a-prime-logs/run-46100522620-attempt-1/prime-log-traces.json | tee "$E/trace-generation.log"
          node formalization/cr-alp/redteam_signed_pilot.js custody/cr-alp-lean-03b2b1-constant-traces/run-46099447047-attempt-1/constant-traces.json custody/cr-alp-lean-03b2b2a-prime-logs/run-46100522620-attempt-1/prime-log-traces.json "$P/signed-pilot.json" > "$E/redteam-replay.json"
          cmp "$P/signed-pilot.json" custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-46105441217-attempt-1/signed-pilot.json
          cmp "$P/SignedPilot.lean" custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-46105441217-attempt-1/SignedPilot.lean
          cp formalization/cr-alp/LEAN-03B2B2B2A-R1_REDTEAM.md "$E/"
          echo 'R0 literal numerical trace and generated pilot source identity PASS' | tee "$E/identity.log"
          cp "$P/signed-pilot.json" "$E/"
          cp "$P/"*.lean "$E/"
          python3 - "$P" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          for name,count in [('SignedGridSeries',8),('SignedPilot',34)]:
              t=(p/(name+'.lean')).read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|axiom|native_decide)\b',t)
              assert len(re.findall(r'(?m)^#print axioms ',t))==count
          PY
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/alp03b2b2b2a-project"
          E="$RUNNER_TEMP/alp03b2b2b2a-evidence"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$P"
          { lean --version; lake --version; lake exe cache get; } 2>&1 | tee "$E/setup.log"
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 5ed2965256430c3649e86755f9576b54eca72435
          git -C .lake/packages/mathlib rev-parse HEAD > "$E/mathlib-commit.txt"
      - name: Compile accepted dependencies and new signed-series pilot
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/alp03b2b2b2a-project"
          E="$RUNNER_TEMP/alp03b2b2b2a-evidence"
          cd "$P"
          mkdir -p .lake/build/lib/lean
          for mod in AnalyticGuards DirectedInterval ElementarySeries TrigSeries DirectedEvaluation RationalTrace Log2Actual ConstAtan5 ConstAtan239 ConstPi GridTrace PrimeLogTrace PrimeLog3 PrimeLog5 PrimeLog7 PrimeLog9 PrimeLogs; do
            timeout 12m lake env lean -o ".lake/build/lib/lean/$mod.olean" "$mod.lean" 2>&1 | tee "$E/$mod-build.log"
            test -s ".lake/build/lib/lean/$mod.olean"
            sha256sum ".lake/build/lib/lean/$mod.olean" >> "$E/olean.sha256"
          done
          for mod in SignedGridSeries SignedPilot; do
            rc=0
            blocked=""
            if [ "$mod" = SignedPilot ] && [ ! -s .lake/build/lib/lean/SignedGridSeries.olean ]; then blocked="SignedGridSeries"; fi
            if [ -n "$blocked" ]; then
              printf '%s\n' "DEPENDENCY_BLOCKED:$blocked" > "$E/$mod.log"
              rc=125
            else
              { time timeout 12m lake env lean -o ".lake/build/lib/lean/$mod.olean" "$mod.lean"; } 2>&1 | tee "$E/$mod.log" || rc=$?
            fi
            printf '%s\n' "$rc" > "$E/$mod.exit"
            if [ "$rc" = 0 ]; then
              test -s ".lake/build/lib/lean/$mod.olean"
              sha256sum ".lake/build/lib/lean/$mod.olean" >> "$E/olean.sha256"
            fi
          done
      - name: Strict named audit and numerical cross-replay acceptance
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/alp03b2b2b2a-evidence"
          python3 - "$E" <<'PY'
          import json,re,sys,hashlib
          from pathlib import Path
          p=Path(sys.argv[1])
          allowed={'propext','Classical.choice','Quot.sound'}
          trace=json.loads((p/'signed-pilot.json').read_text())
          red=json.loads((p/'redteam-replay.json').read_text())
          assert red['status']=='INDEPENDENT_SIGNED_PILOT_PASS' and red['matched']
          assert red['ops']==2406 and red['mutations']==4812 and trace['period']==42
          assert {k:v['width'] for k,v in trace['traces'].items()}=={'Sin':'14402668','Cos':'14297535','Atan':'707'}
          assert all(trace[k]==red[k] for k in trace if k not in ('source_blob','sha256'))
          assert hashlib.sha256((p/'SignedPilot.lean').read_bytes()).hexdigest()==trace['sha256']
          modules={};all_ok=True
          for mod,count in [('SignedGridSeries',8),('SignedPilot',34)]:
              src=(p/(mod+'.lean')).read_text()
              names=re.findall(r'(?m)^#print axioms ([\w.]+)$',src)
              assert len(names)==count and len(set(names))==count
              rc=int((p/(mod+'.exit')).read_text())
              log=(p/(mod+'.log')).read_text()
              found={};issues=[]
              if rc==125 and log.startswith('DEPENDENCY_BLOCKED:'):
                  modules[mod]={'status':'BLOCKED','expected':count,'declarations':{},'issues':[log.strip()]}
                  all_ok=False
                  continue
              if rc!=0:issues.append('compiler exit '+str(rc))
              if re.search(r'(?m)^\s*(?:error:|.*: error:)',log):issues.append('compiler error')
              for name in names:
                  hits=list(re.finditer(r"^'"+re.escape(name)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",log,re.M))
                  if len(hits)!=1:
                      issues.append(name+': missing or duplicate audit');continue
                  ax={a.strip() for a in (hits[0].group(1) or '').split(',') if a.strip()}
                  if not ax<=allowed:issues.append(name+': forbidden axiom '+str(sorted(ax-allowed)))
                  else:found[name]=sorted(ax)
              ok=not issues and len(found)==count
              modules[mod]={'status':'PASS' if ok else 'FAIL','expected':count,'declarations':found,'issues':issues}
              all_ok=all_ok and ok
          (p/'receipts.json').write_text(json.dumps({'status':'NATIVE_SIGNED_PILOT_PASS' if all_ok else 'PARTIAL_OR_FAILED','source_head':(p/'source-head.txt').read_text().strip(),'modules':modules,'trace_terms':1200,'pilot_operations':red['ops'],'redteam_mutations':red['mutations'],'width_units':{k:v['width'] for k,v in trace['traces'].items()},'independent_replay':red['status'],'scope':'Actual 046 sine/cosine j85 n9 and shifted atan j85 pilot only; bulk evaluation and physical coefficients remain separate.'},indent=2)+'\n')
          print('Signed series module disposition:',{k:v['status'] for k,v in modules.items()})
          PY
      - name: Seal evidence
        if: always()
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/alp03b2b2b2a-evidence"
          mkdir -p "$E"
          printf 'source=%s\njob_status=%s\n' "$GITHUB_SHA" "${{ job.status }}" > "$E/attempt.txt"
          cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr-alp-lean03b2b2b2a-signed-pilot
          path: ${{ runner.temp }}/alp03b2b2b2a-evidence/
          if-no-files-found: error
      - name: Preserve remote evidence, then enforce native acceptance
        if: always()
        run: |
          set -euo pipefail
          ROOT="custody/cr-alp-lean-03b2b2b2a-signed-pilot/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cp -a "$RUNNER_TEMP/alp03b2b2b2a-evidence/." "$ROOT/"
          (cd "$ROOT"; sha256sum -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add "$ROOT"
          git commit -m 'CR-ALP LEAN-03B2B2B2A: preserve signed series pilot evidence [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          REMOTE="$(mktemp -d)"
          git archive FETCH_HEAD "$ROOT" | tar -x -C "$REMOTE"
          (cd "$REMOTE/$ROOT"; sha256sum -c SHA256SUMS)
          echo 'Remote native evidence readback PASS'
          python3 - "$ROOT/receipts.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));assert r['status']=='NATIVE_SIGNED_PILOT_PASS',r['status']
          PY
