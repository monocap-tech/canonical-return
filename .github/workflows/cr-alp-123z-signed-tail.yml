name: CR-ALP-123Z signed pole-tail and direction-specific receiver
on:
  workflow_dispatch:
  push:
    branches: ['research/cr-alp-122-fixed-collar-transfer-staged']
    paths: ['custody/cr-alp-123z-activation/READY']
permissions:
  contents: write
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate all frozen inputs
        run: |
          set -euo pipefail
          P=/tmp/alp123z
          E=/tmp/alp123z-evidence
          C="$PWD/custody/cr-alp-074-077"
          mkdir -p "$P" "$E"
          test "$(git hash-object src/audits/cr_alp_123t_second_correction_direction_specific.py)" = 8cbb0b9a41e13abc7a62a24ba5786e206748c528
          (cd "$C/replayed-082"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-091"; sha256sum -c SHA256SUMS)
          (cd custody/cr-alp-122p-quantitative-collar; sha256sum -c SHA256SUMS)
          (cd custody/cr-alp-123s-second-correction; sha256sum -c SHA256SUMS)
          git fetch --depth=1 origin 7c9dc0301df765ab31f9332e9e8c76015b59894c
          git show 7c9dc0301df765ab31f9332e9e8c76015b59894c:custody/cr-alp-074-077/replayed-121/result.json > "$P/frozen.json"
          test "$(git hash-object "$P/frozen.json")" = 2b55baf0e81ac9a296276f396f02633553e58b28
          (cd custody/cr-alp-123n-expanded-joint-trials; sha256sum -c SHA256SUMS)
          test "$(git hash-object src/audits/cr_alp_123z_signed_tail_readback.py)" = deadd843f75d53c6f962cb9eac1f1aa9f3c122bb
          test "$(git hash-object src/audits/cr_alp_123y_signed_pole_tail.py)" = a5812874b3924e1b76574211e13ab3ab2f59604d
          python3 -m py_compile src/audits/cr_alp_123t_second_correction_direction_specific.py src/audits/cr_alp_123z_signed_tail_readback.py
          python3 src/audits/cr_alp_058_archive/reassemble.py "$P/package.zip"
          python3 -m zipfile -e "$P/package.zip" "$P"
      - name: Generalized separation and direction-specific inverse quadratic
        run: |
          set -euo pipefail
          python3 -u src/audits/cr_alp_123z_signed_tail_readback.py custody/cr-alp-123s-second-correction/result.json custody/cr-alp-123n-expanded-joint-trials/result.json custody/cr-alp-122p-quantitative-collar/result.json /tmp/alp123z-evidence/repaired.json | tee /tmp/alp123z-evidence/repair.log
          python3 -u src/audits/cr_alp_123t_second_correction_direction_specific.py /tmp/alp123z custody/cr-alp-074-077 /tmp/alp123z/frozen.json custody/cr-alp-122p-quantitative-collar/result.json /tmp/alp123z-evidence/repaired.json /tmp/alp123z-evidence/result.json | tee /tmp/alp123z-evidence/receiver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR-ALP-123Z-direction-specific
          path: /tmp/alp123z-evidence/
          if-no-files-found: warn
      - name: Preserve direction-specific receiver
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-123z-signed-direction-specific
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "$ROOT"
          cp -a /tmp/alp123z-evidence/. "$ROOT/"
          (cd "$ROOT"; sha256sum *.log *.json > SHA256SUMS; sha256sum -c SHA256SUMS)
          git add "$ROOT"
          git commit -m 'CR-ALP-123Z: preserve direction-specific inverse receiver [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
