name: RETURN093-A retained source replay and chart custody
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-093a/**'
      - '.github/workflows/master-return-093a.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONINTMAXSTRDIGITS: '0'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate complete auxiliary terminal archive and original sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bank" "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          z="$RUNNER_TEMP/092c.zip"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15148031871/zip" -o "$z"
          echo "3f8f400db7f054b8c359c9d684f3524f81c9473c6a33a0ff9f8bbe053174840a  $z" | sha256sum -c -
          unzip -tq "$z"
          unzip -q "$z" -d "$RUNNER_TEMP/bank"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          for i in 083_reproduction 086_audit; do
            unzip -o -q "$RUNNER_TEMP/archives/RETURN$i.zip" -d "$RUNNER_TEMP/work"
          done
          python -m pip install numpy scipy mpmath
          python -m py_compile research/master-return-093a/*.py
      - name: Reopen retained source and replay original chart
        run: python research/master-return-093a/retained_replay.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/bank" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return093a-retained-replay-and-chart-custody
          path: ${{ runner.temp }}/results/
