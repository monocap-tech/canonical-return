name: RETURN092-A odd alternate and auxiliary inventory
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-092a/**'
      - '.github/workflows/master-return-092a.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONINTMAXSTRDIGITS: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate odd independent assembly and original archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bank" "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          z="$RUNNER_TEMP/091b.zip"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15135057366/zip" -o "$z"
          echo "f6df734fcfc6ff3858c968b337a9d20bf615cb4aa293174bfc9c1dd0f135b245  $z" | sha256sum -c -
          unzip -tq "$z"
          unzip -q "$z" -d "$RUNNER_TEMP/bank"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          for i in 083_reproduction 086_audit 087_audit; do
            unzip -o -q "$RUNNER_TEMP/archives/RETURN$i.zip" -d "$RUNNER_TEMP/work"
          done
          python -m pip install numpy
          python -m py_compile research/master-return-092a/*.py
      - name: Check both odd terminal variants and inventory auxiliary source
        run: python research/master-return-092a/audit_odd_and_inventory.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/bank" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return092a-odd-crosscheck-and-source-inventory
          path: ${{ runner.temp }}/results/
