name: RETURN097-B-C remaining finite source audits
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-097b/**'
      - 'research/master-return-097c/**'
      - '.github/workflows/master-return-097bc.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original archives and prepare interval environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results/early" "$RUNNER_TEMP/results/features"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m pip install numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0
          python -m py_compile research/master-return-097b/audit_early.py research/master-return-097c/audit_features.py
      - name: Regenerate early mixed rows
        id: early
        continue-on-error: true
        run: python research/master-return-097b/audit_early.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results/early"
      - name: Regenerate full compressed feature bank
        id: features
        continue-on-error: true
        run: python research/master-return-097c/audit_features.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results/features"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return097bc-remaining-finite-sources
          path: ${{ runner.temp }}/results/
      - name: Require both independent containment gates
        if: always()
        run: |
          test "${{ steps.early.outcome }}" = success
          test "${{ steps.features.outcome }}" = success
