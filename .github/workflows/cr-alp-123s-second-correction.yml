name: CR-ALP-123S second auxiliary correction
on:
  push:
    branches: ['research/cr-alp-122-fixed-collar-transfer-staged']
    paths: ['.github/workflows/cr-alp-123s-second-correction.yml']
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate frozen source and prepare proposal solver
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==2.2.6
          test "$(git hash-object src/audits/cr_alp_123s_second_auxiliary_correction.py)" = 02dab8ace9923a484af7061a9155d4a1c1dc2354
          (cd custody/cr-alp-123n-expanded-joint-trials; sha256sum -c SHA256SUMS)
          (cd custody/cr-alp-122p-quantitative-collar; sha256sum -c SHA256SUMS)
          python3 -m py_compile src/audits/cr_alp_123s_second_auxiliary_correction.py
          mkdir -p /tmp/alp123s /tmp/alp123s-evidence
          python3 src/audits/cr_alp_058_archive/reassemble.py /tmp/alp123s/package.zip
          python3 -m zipfile -e /tmp/alp123s/package.zip /tmp/alp123s
      - name: Independent E850 correction and complete residual evaluation
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python3 -u src/audits/cr_alp_123s_second_auxiliary_correction.py /tmp/alp123s custody/cr-alp-123n-expanded-joint-trials/result.json custody/cr-alp-122p-quantitative-collar/result.json /tmp/alp123s-evidence/result.json | tee /tmp/alp123s-evidence/receiver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR-ALP-123S-second-correction
          path: /tmp/alp123s-evidence/
          if-no-files-found: warn
      - name: Preserve exact second correction receiver
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-123s-second-correction
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "$ROOT"
          cp -a /tmp/alp123s-evidence/. "$ROOT/"
          (cd "$ROOT"; sha256sum *.log *.json > SHA256SUMS; sha256sum -c SHA256SUMS)
          git add "$ROOT"
          git commit -m 'CR-ALP-123S: preserve second auxiliary correction [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
