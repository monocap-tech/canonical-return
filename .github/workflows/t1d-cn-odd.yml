name: T1D CN thirteen-dimensional odd comparison on 80 correctors
on:
  push:
    branches: [research/cr-int-t1d-cn-odd-schur]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical environment
        run: |
          mkdir -p custody/cn/generated
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python --version > custody/cn/generated/python-version.txt
          python -m pip freeze > custody/cn/generated/pip-freeze.txt
      - name: Verify committed CF files and reconstruct original source
        run: |
          (cd custody/cf/generated && sha256sum -c sha256.txt)
          (cd custody/cg/generated && sha256sum -c sha256.txt)
          (cd custody/ch/generated && sha256sum -c sha256.txt)
          (cd custody/cj/generated && sha256sum -c sha256.txt)
          (cd custody/ck/generated && sha256sum -c sha256.txt)
          (cd custody/cl/generated && sha256sum -c sha256.txt)
          (cd custody/cm/generated && sha256sum -c sha256.txt)
          python custody/ce/reconstruct.py
          python - <<'PY'
          import csv
          def read(path):
              with open(path) as f: return {r.get('archive',r.get('name')):(int(r['bytes']),r['sha256']) for r in csv.DictReader(f,delimiter='\t')}
          assert read('custody/ce/evidence/archive-sha256.tsv')==read('ce-output/archive-verification.tsv')
          print('ALL 56 CE DIGESTS MATCH')
          PY
      - name: Verify recorded inherited paths
        run: python custody/recover_t1d_dependencies.py ce-output/archives ce-output/pristine --ledger custody/missing_inherited.tsv --report custody/cn/generated/recovery.tsv
      - name: Expanded thirteen-dimensional odd trial
        run: bash custody/cn/run.sh
      - name: Manifest and permanent evidence
        if: always()
        run: |
          mkdir -p custody/cn/generated
          (cd custody/cn/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-cn-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/cn/generated/
          git commit -m "CN exact Schur comparison evidence run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
      - name: Artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1d-cn-evidence
          path: custody/cn/generated/
          retention-days: 90
