name: RETURN101-B independent Arb raw coefficient audit
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-101b/**'
      - '.github/workflows/master-return-101b.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original inputs and prepare Arb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m pip install python-flint==0.8.0
          python -m py_compile research/master-return-101b/audit_raw_coefficients.py
      - name: Independently regenerate all physical raw coefficient sets
        run: python research/master-return-101b/audit_raw_coefficients.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return101b-independent-raw-coefficients
          path: ${{ runner.temp }}/results/
