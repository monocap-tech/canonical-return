name: RETURN096-A Fourier constraint attachment
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-096a/**'
      - '.github/workflows/master-return-096a.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m py_compile research/master-return-096a/constraint_attachment.py
      - name: Verify literal retained index partition and chart ranks
        run: python research/master-return-096a/constraint_attachment.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return096a-fourier-constraint-attachment
          path: ${{ runner.temp }}/results/
