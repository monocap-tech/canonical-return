              Gr=inflate(h*rat(gram(PR),R*R),ePR)+young(Gz,Gs)
              assert np.array_equal(Gr,Gr.T)
              receipt['continuous']={'cell_count':nc,'cell_width':str(h),'fourier_size':N,'shift_breakpoints':len(shifts),'mean_residual_norm_upper':float(sqrtup(rows(inflate(h*rat(gram(PR),R*R),ePR)))),'shift_variance_norm_squared_upper':float(rows(Gz)),'smooth_variance_norm_squared_upper':float(rows(Gs)),'continuous_residual_gram_norm_upper':float(rows(Gr)),'projection_errors':{'v':str(ePV),'surplus':str(ePS),'shift':str(eZbar)},'exact_shift_overlay':'PASS','integer_fft':'PASS','alias_handling':'exact original frequency phase and sinc; modulo N DFT bins; additive collisions'}
              save()
              # M>=I inherited; for r=v-Mu,
              # v*M^-1 v <= 2 sym(v*u)-u*Mu+r*r,
              # ||M^-1v||^2 <= (1+t)u*u+(1+1/t)r*r.
              # Representation transport uses the existing weighted D.
              cross=h*rat(gram(U,PV),R*R);mc=h*rat(gram(U,i64(obj(PS)+obj(Zbar))),R*R)
              Fup=2*sym(cross)-sym(mc)+nu*(2*ePV+ePS+eZbar)*np.eye(32,dtype=object)
              delta=F(str(v['delta']));t=F(str(v['t']));mu=F(str(v['mu']));assert delta>0 and t>0 and mu==F(53,10000)
              H=Fup+(1+delta*(1+1/t))*Gr+delta*(1+t)*Gu
              E=fr(v['E']);pen=fr(v['penalty']);er=F(str(v['energy_error']))
              L=E-pen-H/mu-er*np.eye(32,dtype=object);assert np.array_equal(L,L.T)
              eig=np.linalg.eigvalsh(np.array(L,float))
              # Exact lower comparison via symmetric integer flooring and
