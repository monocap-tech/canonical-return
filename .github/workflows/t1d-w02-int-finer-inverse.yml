              Cfull=np.vstack([C,-SC]);jfull=np.r_[jv,rj]
              deriv=i64(Cfull*jfull[:,None]*R//G)
              Gd=2*F(22,56)**2*rat(gram(deriv),R*R)
              # Conversion and original coefficient enclosure: full double
              # circle sine/cosine norm sqrt(2), max frequency j*pi/8.
              ed=sqrtup(F(2*deriv.size))*F(22,56)*(F(1,R)+int(max(jfull))*max(cerror,coeferr))
              Gd=inflate(Gd,ed)
              # ||(sinh(x/2))'||_L2(I) < 2.
              Gp=4*rat(pc.T@pc,ps*ps)
              Gs=(h/3)**2*young(Gd,Gp)
              # Orthogonal cell means and within-cell error. No assumption
