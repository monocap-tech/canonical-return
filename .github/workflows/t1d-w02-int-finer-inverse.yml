              S=10**14
              A=np.vectorize(lambda x:int(x*S//1),otypes=[object])(L)-32*np.eye(32,dtype=object)
              def ldl(k):
                  B=rat(A-k*np.eye(32,dtype=object),S)
                  for i in range(32):
                      a=B[i,i]
                      if a<=0:return False
                      for j in range(i+1,32):
                          for l in range(j,32):B[l,j]=B[j,l]=B[l,j]-B[l,i]*B[j,i]/a
                  return True
              positive=ldl(0);lower=F(0)
