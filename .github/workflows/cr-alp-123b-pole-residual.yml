name: CR-ALP-123B pole residual census
on:
  push:
    branches: ['research/cr-alp-122-fixed-collar-transfer-staged']
    paths: ['.github/workflows/cr-alp-123b-pole-residual.yml']
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct extended original matrix and rational pole trials
        run: |
          set -euo pipefail
          P=/tmp/alp123b
          E=/tmp/alp123b-evidence
          mkdir -p "$P" "$E"
          python3 src/audits/cr_alp_058_archive/reassemble.py "$P/package.zip"
          python3 -m zipfile -e "$P/package.zip" "$P"
          python3 src/audits/cr_alp_123b_pole_residual.py "$P" "$E/result.json" | tee "$E/census.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR-ALP-123B-pole-residual-census
          path: /tmp/alp123b-evidence/
          if-no-files-found: error
      - name: Preserve residual census
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-123b-pole-residual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "$ROOT"
          cp -a /tmp/alp123b-evidence/. "$ROOT/"
          (cd "$ROOT"; sha256sum *.log *.json > SHA256SUMS; sha256sum -c SHA256SUMS)
          git add "$ROOT"
          git commit -m 'CR-ALP-123B: preserve exact extended pole residual census [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
