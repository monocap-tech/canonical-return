name: RETURN095-A conditional true-source Schur transport
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-095a/**'
      - '.github/workflows/master-return-095a.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate terminal and metric artifacts and source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/banks" "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          while read -r label id digest; do
            z="$RUNNER_TEMP/$label.zip"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$z"
            echo "$digest  $z" | sha256sum -c -
            unzip -tq "$z"
            mkdir -p "$RUNNER_TEMP/banks/$label"
            unzip -q "$z" -d "$RUNNER_TEMP/banks/$label"
          done <<'BANKS'
          093b 15149302173 e2a52d486b26929527d191b2c6918280d11893e0e8d0bec8c23cd7cf58fc6279
          094a 15150541588 64541bc860f0dc888de33e0f12f9f00776e432fd639f4c1a959c7de6facda22a
          BANKS
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m py_compile research/master-return-095a/transport.py
      - name: Verify exact conditional Schur transport and chart bindings
        run: python research/master-return-095a/transport.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/banks" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return095a-conditional-true-source-transport
          path: ${{ runner.temp }}/results/
