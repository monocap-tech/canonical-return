name: RETURN106-B2 fine-scale literal finite input attachment
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-106b2/**'
      - '.github/workflows/master-return-106b2.yml'
permissions:
  contents: read
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original reader and independent evaluator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -oq "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          unzip -oq "$RUNNER_TEMP/archives/RETURN087_audit.zip" -d "$RUNNER_TEMP/work"
          python -m pip install python-flint==0.8.0 numpy==2.2.6
          python -m py_compile research/master-return-106b2/bind_fine_inputs.py
      - name: Check all independently regenerated finite rows at fine scale
        run: python research/master-return-106b2/bind_fine_inputs.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return106b2-fine-scale-literal-attachment
          path: ${{ runner.temp }}/results/
