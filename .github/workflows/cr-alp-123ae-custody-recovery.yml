name: CR-ALP-123AE original artifact custody recovery
on:
  push:
    branches: ['research/cr-alp-122-fixed-collar-transfer-staged']
    paths: ['.github/workflows/cr-alp-123ae-custody-recovery.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: cr-alp-123ae-custody-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact original archive, validate and split without mathematical rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-123ae-joint-projected
          test ! -e "$ROOT"
          mkdir -p "$ROOT/parts"
          WORK="$(mktemp -d)"
          export WORK ROOT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15177356415/zip" > "$WORK/original.zip"
          test "$(wc -c < "$WORK/original.zip")" = 130454707
          echo "7b8fecd5b134b74ab83653d6d073a7cb4fcefe9d66552dc88fcc70f8caec75d7  $WORK/original.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, os, sys, zipfile
          from fractions import Fraction as F
          from pathlib import Path
          sys.set_int_max_str_digits(0)
          root=Path(os.environ['ROOT']); work=Path(os.environ['WORK']); archive=work/'original.zip'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())=={'SHA256SUMS','preflight.log','receiver.log','result.json'}
              assert z.testzip() is None
              z.extractall(work/'members')
          m=work/'members'
          expected={}
          for line in (m/'SHA256SUMS').read_text().splitlines():
              h,name=line.split(maxsplit=1); expected[name]=h
          assert set(expected)=={'preflight.log','receiver.log','result.json'}
          def filehash(p):
              with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          for name,h in expected.items():
              assert filehash(m/name)==h
          for name in ('SHA256SUMS','preflight.log','receiver.log'):
              (root/name).write_bytes((m/name).read_bytes())
          d=json.loads((m/'result.json').read_text())
          assert d['status']=='CONDITIONAL_JOINT_PROJECTED_RESPONSE_DEFECT_RECEIVER'
          assert d['source_sha256']=='a7a334e6eca63543d7f322aef124c4491c986ba878bd1434f484e86743856473'
          assert set(d['sectors'])=={'1','2'}
          srcpath=Path('custody/cr-alp-123ac-response-defect/result.json')
          assert filehash(srcpath)==d['source_sha256']
          src=json.loads(srcpath.read_text())
          report={'status':'CUSTODY_ONLY_ORIGINAL_123AE_OUTPUT','source_run':45951947443,'source_artifact':15177356415,'source_activation':'d3b6754fcd3b9ce8fe7928e51b2df6fe1a2f298e','source_sha256':d['source_sha256'],'original_archive_sha256':filehash(archive),'original_archive_bytes':archive.stat().st_size,'members':{n:{'bytes':(m/n).stat().st_size,'sha256':filehash(m/n)} for n in ['SHA256SUMS','preflight.log','receiver.log','result.json']},'sectors':{},'parts':[]}
          for k,s in d['sectors'].items():
              o=src['sectors'][k]; n=44-int(k)
              for key in ['E','U','finite_charge_upper']:assert F(s[key])==F(o[key])
              assert 0<=F(s['eta_upper'])<=F(o['eta_upper'])
              assert F(s['loss_upper'])<=F(o['loss_upper'])
              assert F(s['conditional_pole_schur_lower'])==F(s['E'])-F(s['loss_upper'])
              assert s['classification']==('PASS_COMPLETE_POLE_SECTOR_CONDITIONAL' if F(s['E'])>F(s['loss_upper']) else 'SUFFICIENT_BOUND_INCONCLUSIVE')
              for key in ['prefix_midpoint_gram','tail_leading_gram','joint_midpoint_gram']:
                  assert len(s[key])==n and all(len(row)==n for row in s[key])
              keys=['prefix_midpoint_spectral_upper','prefix_error_frobenius2','prefix_trace_upper','prefix_spectral_upper','tail_leading_spectral_upper','tail_coefficient_error_norm_upper','tail_remainder_frobenius2_upper','tail_trace_upper','tail_spectral_upper','eta_split_upper','joint_midpoint_spectral_upper','joint_perturbation_reserve','eta_joint_upper','pole_subtraction_error_reserve','projected_midpoint_spectral_upper','eta_projected_upper','eta_upper']
              v={key:float(F(s[key])) for key in keys}
              v.update({'dimension':n,'classification':s['classification'],'previous_eta_upper':float(F(o['eta_upper'])),'loss_over_E':float(F(s['loss_upper'])/F(s['E'])),'U_over_E':float(F(s['U'])/F(s['E'])),'finite_charge_over_E':float(F(s['finite_charge_upper'])/F(s['E'])),'necessary_eta_ceiling_ignoring_finite_charge':float(F(s['E'])/F(s['U'])-1)})
              report['sectors'][k]=v
          with archive.open('rb') as f:
              i=0
              while b:=f.read(16*1024*1024):
                  name=f'parts/{i:03d}.zip.part'
                  (root/name).write_bytes(b)
                  report['parts'].append({'path':name,'bytes':len(b),'sha256':sha(b)})
                  i+=1
          assert len(report['parts'])==8
          (root/'recovery.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          cat > "$ROOT/reassemble.py" <<'PY'
          """Verify and reconstruct exact original ZIP; no mathematical execution."""
          import hashlib,json,sys,zipfile
          from pathlib import Path
          p=Path(__file__).resolve().parent
          d=json.loads((p/'recovery.json').read_text())
          out=Path(sys.argv[1])
          with out.open('wb') as f:
              for part in d['parts']:
                  b=(p/part['path']).read_bytes()
                  assert len(b)==part['bytes'] and hashlib.sha256(b).hexdigest()==part['sha256']
                  f.write(b)
          with out.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==d['original_archive_sha256']
          assert out.stat().st_size==d['original_archive_bytes']
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None and set(z.namelist())==set(d['members'])
              for n,m in d['members'].items():
                  with z.open(n) as f: assert hashlib.file_digest(f,'sha256').hexdigest()==m['sha256']
                  assert z.getinfo(n).file_size==m['bytes']
          print('Exact original ZIP and member readback PASS')
          PY
          python3 "$ROOT/reassemble.py" "$WORK/reassembled.zip"
          cmp "$WORK/original.zip" "$WORK/reassembled.zip"
      - name: Preserve exact archive chunks and verify remote branch
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-123ae-joint-projected
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          git commit -m 'CR-ALP-123AE: preserve exact original archive in bounded chunks [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          REMOTE="$(mktemp -d)"
          git archive FETCH_HEAD "$ROOT" | tar -x -C "$REMOTE"
          python3 "$REMOTE/$ROOT/reassemble.py" "$REMOTE/verified.zip"
          echo 'Remote exact archive reconstruction PASS'
