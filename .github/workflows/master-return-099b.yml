name: RETURN099-B joint evidence binding
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-099b/**'
      - '.github/workflows/master-return-099b.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original archive and prepare arithmetic environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results" "$RUNNER_TEMP/banks"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m pip install numpy==2.2.6
          python -m py_compile research/master-return-099b/joint_binding.py
      - name: Download and authenticate accepted evidence ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/banks"
          fetch() {
            local label="$1" id="$2" digest="$3"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$label.zip"
            echo "$digest  $label.zip" | sha256sum -c -
            unzip -tq "$label.zip"
            mkdir -p "$label"
            unzip -q "$label.zip" -d "$label"
          }
          fetch 093b 15149302173 e2a52d486b26929527d191b2c6918280d11893e0e8d0bec8c23cd7cf58fc6279
          fetch 094a 15150541588 64541bc860f0dc888de33e0f12f9f00776e432fd639f4c1a959c7de6facda22a
          fetch 095a 15152151877 abbe06629b51bff6dc33f6ec98590ee05d8e96d29b234c404c826041b0b61ea4
          fetch 095b 15151689152 3e0790d5f8fdbfb4af00bf571f0a6952f2e48eeed28afa81983669eef90ca02f
          fetch 096a 15152282472 e10bae064c9bfaef70db287688bc6a9de2f95d2577eeadc3b01deadaff331dc0
          fetch 096b 15154081894 63d266caaebfaf24847fbf6f332e482b4c77b8a1d8a7dcbc795bad44789c7bc8
          fetch 097a 15157603234 393387757feda6d590fd99ab4a79a556eb2b84c472c034931a0e424395bd0efa
          fetch 097bc 15158350445 5563638a2b07f685642150d56c5f38bc4e314dda698c1ac3cbfbf764844558f1
      - name: Joint exact receipt and interval binding
        run: python research/master-return-099b/joint_binding.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/banks" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return099b-joint-conditional-evidence
          path: ${{ runner.temp }}/results/
