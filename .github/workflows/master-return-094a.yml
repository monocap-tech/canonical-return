name: RETURN094-A exact restoration metric
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-094a/**'
      - '.github/workflows/master-return-094a.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate frozen original source archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m py_compile research/master-return-094a/audit_restoration_metric.py
      - name: Exact rational restoration factor and rank audit
        run: python research/master-return-094a/audit_restoration_metric.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return094a-restoration-metric
          path: ${{ runner.temp }}/results/
