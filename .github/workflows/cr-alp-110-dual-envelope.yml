name: CR-ALP-110 dual joint envelope
on:
  push:
    branches: ['execution/cr-alp-110-dual-envelope-20261126']
    paths: ['.github/workflows/cr-alp-110-dual-envelope.yml']
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Register isolated execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '{run_id:$run,source_commit:$sha}' >/tmp/run.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/custody/cr-alp-074-077/110_run_${GITHUB_RUN_ID}.json" -f branch="$GITHUB_REF_NAME" -f message="CR-ALP-110 run $GITHUB_RUN_ID [skip ci]" -f content="$(base64 -w0 /tmp/run.json)"
      - name: Authenticate and replay earlier receiving evidence
        run: |
          set -euo pipefail
          P=/tmp/cr-alp110
          C="$PWD/custody/cr-alp-074-077"
          A="$C/archives"
          (cd "$A"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-077"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-078"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-079"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-081"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-082"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-085"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-086"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-087"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-088"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-089"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-090"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-091"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-092"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-093"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-094"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-095"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-096"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-097"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-098"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-099"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-100"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-101"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-102"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-103"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-104"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-105"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-106"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-107"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-108"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-109"; sha256sum -c SHA256SUMS)
          mkdir -p "$P/old-bank" "$P/old-logs" "$P/old-result" "$P/new"
          python3 -m zipfile -e "$A/CR-ALP-075-source-bank.zip" "$P/old-bank"
          python3 -m zipfile -e "$A/CR-ALP-075-prefix-receiver.zip" "$P/old-result"
          for name in reused-native-norms new-norms-1 new-norms-2; do
            python3 -m zipfile -e "$A/CR-ALP-075-$name.zip" "$P/old-logs"
          done
          (cd "$P/old-bank"; sha256sum -c SHA256SUMS)
          (cd "$P/old-logs"; for m in SHA256SUMS.1 SHA256SUMS.2 SHA256SUMS.new1 SHA256SUMS.new2; do sha256sum -c "$m"; done)
          python3 src/audits/cr_alp_058_archive/reassemble.py "$P/package.zip"
          python3 -m zipfile -e "$P/package.zip" "$P"
          (cd "$P/cr_alp_058"; sha256sum -c SHA256SUMS; python3 validate_geometry.py)
          python3 src/audits/cr_alp_075_prefix_receiver.py "$P/old-bank" "$P/old-logs" "$P/replayed-prefix.json"
          cmp "$P/replayed-prefix.json" "$P/old-result/result.json"
          python3 src/audits/cr_alp_077_durable_replay.py receive "$P" "$P/old-bank" "$C/replayed-077" "$P/replayed-prefix.json" src/audits/CR-ALP-077_inverse_diagonal_screen.json "$P/replayed-077.json"
          cmp "$P/replayed-077.json" "$C/replayed-077/result.json"
      - name: Build all sources and verify reuse of seventy inputs
        run: |
          set -euo pipefail
          P=/tmp/cr-alp110
          python3 src/audits/cr_alp_078_source_bank.py "$P" "$P/bank"
          count=0
          for f in "$P"/old-bank/input_*.txt; do
            cmp "$f" "$P/bank/$(basename "$f")"
            count=$((count+1))
          done
          test "$count" -eq 70
          cmp "$P/bank/source_bank.json" "$PWD/custody/cr-alp-074-077/replayed-082/source_bank.json"
          python3 -c 'import numpy' || python3 -m pip install --user --break-system-packages numpy
          echo 'PASS original source regeneration'
      - name: Replay adaptive response and test refined joint envelope
        run: |
          set -euo pipefail
          P=/tmp/cr-alp110
          C="$PWD/custody/cr-alp-074-077"
          python3 -c 'import numpy, scipy' || python3 -m pip install --user --break-system-packages numpy scipy
          python3 src/audits/cr_alp_095_adaptive_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-094" "$C/replayed-095" "$P/new/replayed_adaptive.json"
          cmp "$P/new/replayed_adaptive.json" "$C/replayed-095/result.json"
          python3 src/audits/cr_alp_097_adaptive_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-096" "$C/replayed-097" "$P/new/replayed_adaptive2.json"
          cmp "$P/new/replayed_adaptive2.json" "$C/replayed-097/result.json"
          python3 src/audits/cr_alp_097_adaptive_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-098" "$C/replayed-099" "$P/new/replayed_adaptive3.json"
          cmp "$P/new/replayed_adaptive3.json" "$C/replayed-099/result.json"
          python3 src/audits/cr_alp_097_adaptive_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-100" "$C/replayed-101" "$P/new/replayed_adaptive4.json"
          cmp "$P/new/replayed_adaptive4.json" "$C/replayed-101/result.json"
          python3 src/audits/cr_alp_103_bottleneck_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-103/selection" "$C/replayed-103" "$P/new/replayed_adaptive5.json"
          cmp "$P/new/replayed_adaptive5.json" "$C/replayed-103/result.json"
          python3 src/audits/cr_alp_103_bottleneck_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-105/selection" "$C/replayed-105" "$P/new/replayed_adaptive6.json"
          cmp "$P/new/replayed_adaptive6.json" "$C/replayed-105/result.json"
          python3 src/audits/cr_alp_103_bottleneck_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-107/selection" "$C/replayed-107" "$P/new/replayed_adaptive7.json"
          cmp "$P/new/replayed_adaptive7.json" "$C/replayed-107/result.json"
          python3 src/audits/cr_alp_103_bottleneck_response.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-109/selection" "$C/replayed-109" "$P/new/replayed_adaptive8.json"
          cmp "$P/new/replayed_adaptive8.json" "$C/replayed-109/result.json"
          python3 src/audits/cr_alp_110_dual_envelope.py "$P" "$P/bank" "$C/replayed-082/result.json" "$C/replayed-085" "$C/replayed-091/result.json" "$C/replayed-086" "$C/replayed-090/result.json" "$C/replayed-092/result.json" "$C/replayed-093/result.json" "$C/replayed-094" "$P/new/replayed_adaptive.json" "$C/replayed-096" "$P/new/replayed_adaptive2.json" "$C/replayed-098" "$P/new/replayed_adaptive3.json" "$C/replayed-100" "$P/new/replayed_adaptive4.json" "$C/replayed-103/selection" "$P/new/replayed_adaptive5.json" "$C/replayed-102/result.json" "$C/replayed-105/selection" "$P/new/replayed_adaptive6.json" "$C/replayed-104/result.json" "$C/replayed-107/selection" "$P/new/replayed_adaptive7.json" "$C/replayed-106/result.json" "$C/replayed-109/selection" "$P/new/replayed_adaptive8.json" "$C/replayed-108/result.json" "$P/new/result.json"
          (cd "$P/new"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS; sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR-ALP-110-dual-envelope
          path: /tmp/cr-alp110/new/
          if-no-files-found: error
          retention-days: 90
      - name: Durable evidence commit even if no rank increase
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-074-077/replayed-110
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "$ROOT"
          cp -a /tmp/cr-alp110/new/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'CR-ALP-110: preserve refined envelope outcomes [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          COMMIT=$(git rev-parse HEAD)
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$COMMIT"
          mkdir -p /tmp/remote-check
          git archive FETCH_HEAD "$ROOT" | tar -x -C /tmp/remote-check
          (cd "/tmp/remote-check/$ROOT"; sha256sum -c SHA256SUMS)
          echo "DURABLE CR-ALP-110 RECEIVER $COMMIT"
