name: W02 INT recover completed inverse computation
on:
  push:
    branches: [research/cr-int-t1d-ep-targeted-corrector-staged]
    paths: [.github/workflows/t1d-w02-int-inverse-recover.yml]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            custody/w02-int/audits
      - uses: actions/checkout@v4
        with:
          ref: a4b63576f4a617c42975fdae85898fd1842739d6
          path: receiver-evidence
          sparse-checkout: |
            custody/w02-int/frozen-receiver/500
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recover immutable completed artifact and replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install numpy==2.3.5 sympy==1.14.0
          mkdir -p custody/w02-int/inverse-recovered
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/15232356317/zip > /tmp/inverse.zip
          echo '42cb9924d5b89d6c9516b528770f217a3516dd3473daedce9eaf5ba0c20aa525  /tmp/inverse.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          p=Path('custody/w02-int/inverse-recovered')
          with zipfile.ZipFile('/tmp/inverse.zip') as z:
              assert z.testzip() is None
              for n in ('result.json','comparison.npz','bn_energy.py'):
                  hits=[i for i in z.namelist() if Path(i).name==n]
                  assert len(hits)==1,(n,hits)
                  (p/n).write_bytes(z.read(hits[0]))
          r=json.loads((p/'result.json').read_text())
          assert r['status']=='PASS' and r['source_commit']=='d06bdd70305b07195fce2fdf64e4945c0a130b62'
          assert hashlib.sha256((p/'comparison.npz').read_bytes()).hexdigest()==r['comparison']['output_sha256']
          (p/'recovery.json').write_text(json.dumps({'artifact_id':15232356317,'run_id':46067568612,'archive_sha256':'42cb9924d5b89d6c9516b528770f217a3516dd3473daedce9eaf5ba0c20aa525','files':{n:hashlib.sha256((p/n).read_bytes()).hexdigest() for n in ('result.json','comparison.npz','bn_energy.py')},'status':'payload authenticated'},indent=2)+'\n')
          print(json.dumps(r['comparison'],indent=2))
          PY
          python custody/w02-int/audits/continuous_inverse_acceptance.py --identity | tee custody/w02-int/inverse-recovered/identity.log
          set -o pipefail
          python custody/w02-int/audits/continuous_inverse_acceptance.py receiver-evidence/custody/w02-int/frozen-receiver/500/receiver.npz custody/w02-int/inverse-recovered/comparison.npz custody/w02-int/inverse-recovered/result.json | tee custody/w02-int/inverse-recovered/replay.log
      - name: Persist small evidence-only recovery branch
        if: always()
        run: |
          test -f custody/w02-int/inverse-recovered/recovery.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-w02-inverse-recovered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add --sparse -f custody/w02-int/inverse-recovered
          git commit -m "Recover verified completed inverse payload without recomputation"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w02-int-inverse-recovered
          path: custody/w02-int/inverse-recovered/
