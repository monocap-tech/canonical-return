name: RETURN095-B baseline negative-update norm
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-095b/**'
      - '.github/workflows/master-return-095b.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m py_compile research/master-return-095b/negative_update.py
      - name: Reconstruct finite and tail negative-update Gram and verify exact pivots
        run: python research/master-return-095b/negative_update.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return095b-negative-update-norm
          path: ${{ runner.temp }}/results/
