name: T1D CG exact Young parameter optimization
on:
  push:
    branches: [research/cr-int-t1d-cg-young-optimization]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical environment
        run: |
          mkdir -p custody/cg/generated
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python --version > custody/cg/generated/python-version.txt
          python -m pip freeze > custody/cg/generated/pip-freeze.txt
      - name: Verify committed CF files and reconstruct original source
        run: |
          (cd custody/cf/generated && sha256sum -c sha256.txt)
          python custody/ce/reconstruct.py
          python - <<'PY'
          import csv
          def read(path):
              with open(path) as f: return {r.get('archive',r.get('name')):(int(r['bytes']),r['sha256']) for r in csv.DictReader(f,delimiter='\t')}
          assert read('custody/ce/evidence/archive-sha256.tsv')==read('ce-output/archive-verification.tsv')
          print('ALL 56 CE DIGESTS MATCH')
          PY
      - name: Verify recorded inherited paths
        run: python custody/recover_t1d_dependencies.py ce-output/archives ce-output/pristine --ledger custody/missing_inherited.tsv --report custody/cg/generated/recovery.tsv
      - name: Restore frozen four-column inputs
        run: |
          cp custody/cg/cg_compare.py ce-output/pristine/
          cp custody/cf/generated/{bu_trial.npz,joint_circle.npz} ce-output/pristine/cr_int_t1d_ca/
          cp custody/cf/generated/expanded-4096-4096/{even_joint_proposal.npz,even_joint_Uaction.npz} ce-output/pristine/cr_int_t1d_ca/
          sha256sum ce-output/pristine/cr_int_t1d_ca/{bu_trial.npz,joint_circle.npz,even_joint_proposal.npz,even_joint_Uaction.npz}
      - name: Exact baseline and optimized comparisons
        run: |
          set -o pipefail
          python ce-output/pristine/cg_compare.py even "$PWD/custody/cg/generated" "$PWD/custody/cf/generated/expanded-4096-4096/comparison.json" | tee custody/cg/generated/optimization.log
      - name: Manifest and permanent evidence
        if: always()
        run: |
          mkdir -p custody/cg/generated
          (cd custody/cg/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-cg-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/cg/generated/
          git commit -m "CG exact comparison evidence run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
      - name: Artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1d-cg-evidence
          path: custody/cg/generated/
          retention-days: 90
