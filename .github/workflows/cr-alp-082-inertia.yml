name: CR-ALP-082 targeted moments and full inertia
on:
  push:
    branches: ['execution/cr-alp-082-rank-inertia-20261125']
    paths: ['.github/workflows/cr-alp-082-inertia.yml']
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Register isolated execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" '{run_id:$run,source_commit:$sha}' >/tmp/run.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/custody/cr-alp-074-077/082_run_${GITHUB_RUN_ID}.json" -f branch="$GITHUB_REF_NAME" -f message="CR-ALP-082 run $GITHUB_RUN_ID [skip ci]" -f content="$(base64 -w0 /tmp/run.json)"
      - name: Authenticate and replay earlier receiving evidence
        run: |
          set -euo pipefail
          P=/tmp/cr-alp082
          C="$PWD/custody/cr-alp-074-077"
          A="$C/archives"
          (cd "$A"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-077"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-078"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-079"; sha256sum -c SHA256SUMS)
          (cd "$C/replayed-081"; sha256sum -c SHA256SUMS)
          mkdir -p "$P/old-bank" "$P/old-logs" "$P/old-result" "$P/new"
          python3 -m zipfile -e "$A/CR-ALP-075-source-bank.zip" "$P/old-bank"
          python3 -m zipfile -e "$A/CR-ALP-075-prefix-receiver.zip" "$P/old-result"
          for name in reused-native-norms new-norms-1 new-norms-2; do
            python3 -m zipfile -e "$A/CR-ALP-075-$name.zip" "$P/old-logs"
          done
          (cd "$P/old-bank"; sha256sum -c SHA256SUMS)
          (cd "$P/old-logs"; for m in SHA256SUMS.1 SHA256SUMS.2 SHA256SUMS.new1 SHA256SUMS.new2; do sha256sum -c "$m"; done)
          python3 src/audits/cr_alp_058_archive/reassemble.py "$P/package.zip"
          python3 -m zipfile -e "$P/package.zip" "$P"
          (cd "$P/cr_alp_058"; sha256sum -c SHA256SUMS; python3 validate_geometry.py)
          python3 src/audits/cr_alp_075_prefix_receiver.py "$P/old-bank" "$P/old-logs" "$P/replayed-prefix.json"
          cmp "$P/replayed-prefix.json" "$P/old-result/result.json"
          python3 src/audits/cr_alp_077_durable_replay.py receive "$P" "$P/old-bank" "$C/replayed-077" "$P/replayed-prefix.json" src/audits/CR-ALP-077_inverse_diagonal_screen.json "$P/replayed-077.json"
          cmp "$P/replayed-077.json" "$C/replayed-077/result.json"
      - name: Build all sources and verify reuse of seventy inputs
        run: |
          set -euo pipefail
          P=/tmp/cr-alp082
          python3 src/audits/cr_alp_078_source_bank.py "$P" "$P/bank"
          count=0
          for f in "$P"/old-bank/input_*.txt; do
            cmp "$f" "$P/bank/$(basename "$f")"
            count=$((count+1))
          done
          test "$count" -eq 70
          for j in 27 6 16 19 21 18; do cp "$P/bank/input_1_$j.txt" "$P/new/"; done
          for j in 20 8 21 18 28 22; do cp "$P/bank/input_2_$j.txt" "$P/new/"; done
          test "$(find "$P/new" -name 'input_*.txt' | wc -l)" -eq 12
          cmp "$P/bank/source_bank.json" "$PWD/custody/cr-alp-074-077/replayed-078/source_bank.json"
          cp "$P/bank/selection.json" "$P/bank/source_bank.json" "$P/new/"
          echo 'PASS selected twelve original source inputs'
      - name: Evaluate twelve targeted original signed-prime moments
        run: |
          set -euo pipefail
          P=/tmp/cr-alp082
          g++ -O2 -std=gnu++17 "$P/cr_alp_058/validated.cpp" -o "$P/moment" -lquadmath -l:libmpfr.so.6 -lgmp
          cp -a "$P/cr_alp_058" "$P/check"
          for f in "$P"/new/input_*.txt; do
            tag=$(basename "$f" .txt | sed 's/^input_//')
            k=$(printf '%s' "$tag" | cut -d_ -f1)
            cp "$P/cr_alp_058/input_1.txt" "$P/check/input_1.txt"
            cp "$P/cr_alp_058/input_2.txt" "$P/check/input_2.txt"
            cp "$f" "$P/check/input_${k}.txt"
            python3 "$P/check/validate_geometry.py" > "$P/new/mode_$tag.geometry.log"
            "$P/moment" "$f" "$P/cr_alp_058/mesh.txt" "$P/cr_alp_058/gauss.txt" > "$P/new/mode_$tag.log" 2> "$P/new/mode_$tag.radius.log"
            echo "PASS MOMENT $tag"
            cat "$P/new/mode_$tag.log" "$P/new/mode_$tag.radius.log"
          done
      - name: Exact prefix and full-inertia receiver
        run: |
          set -euo pipefail
          P=/tmp/cr-alp082
          python3 -c 'import numpy' || python3 -m pip install --user --break-system-packages numpy
          python3 src/audits/cr_alp_082_inertia_receiver.py "$P" "$P/bank" "$P/replayed-prefix.json" "$P/replayed-077.json" "$PWD/custody/cr-alp-074-077/replayed-078/result.json" "$PWD/custody/cr-alp-074-077/replayed-081/result.json" "$PWD/custody/cr-alp-074-077/replayed-078" "$PWD/custody/cr-alp-074-077/replayed-081" "$P/new" "$P/new/result.json"
          (cd "$P/new"; sha256sum *.txt *.json *.log > SHA256SUMS; sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CR-ALP-082-inertia
          path: /tmp/cr-alp082/new/
          if-no-files-found: error
          retention-days: 90
      - name: Durable evidence commit even if no rank increase
        run: |
          set -euo pipefail
          ROOT=custody/cr-alp-074-077/replayed-082
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p "$ROOT"
          cp /tmp/cr-alp082/new/* "$ROOT/"
          git add "$ROOT"
          git commit -m 'CR-ALP-082: preserve targeted moments and full-inertia receiving outcomes [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          COMMIT=$(git rev-parse HEAD)
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$COMMIT"
          mkdir -p /tmp/remote-check
          git archive FETCH_HEAD "$ROOT" | tar -x -C /tmp/remote-check
          (cd "/tmp/remote-check/$ROOT"; sha256sum -c SHA256SUMS)
          echo "DURABLE CR-ALP-082 RECEIVER $COMMIT"
