name: RETURN102-A independent error budget recomputation
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-102a/**'
      - '.github/workflows/master-return-102a.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m py_compile research/master-return-102a/audit_error_budgets.py
      - name: Recompute all six exact receiving error budgets
        run: python research/master-return-102a/audit_error_budgets.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return102a-independent-error-budgets
          path: ${{ runner.temp }}/results/
