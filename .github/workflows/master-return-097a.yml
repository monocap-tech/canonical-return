name: RETURN097-A alternate grouped mixed source regeneration
on:
  push:
    branches: [research/master-return-090-restricted-audit]
    paths:
      - 'research/master-return-097a/**'
      - '.github/workflows/master-return-097a.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate original archive and prepare interval environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
          bash archive/master-return/reconstruct.sh "$RUNNER_TEMP/archives"
          unzip -q "$RUNNER_TEMP/archives/RETURN083_reproduction.zip" -d "$RUNNER_TEMP/work"
          python -m pip install numpy==2.2.6 mpmath==1.3.0
          python -m py_compile research/master-return-097a/regenerate_grouped.py
      - name: Independently regenerate grouped mixed rows and verify containment
        run: python research/master-return-097a/regenerate_grouped.py "$RUNNER_TEMP/work" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return097a-grouped-source-regeneration
          path: ${{ runner.temp }}/results/
