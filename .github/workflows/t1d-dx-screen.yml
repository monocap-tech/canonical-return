name: T1D DX frozen DV regularized response numerical screen
on:
  push:
    branches: [research/cr-int-t1d-dx-regularized-proposal-staged]
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Static source preflight
        run: |
          python - <<'PY'
          import ast,pathlib,json
          p=pathlib.Path('custody/dx/screen.py')
          ast.parse(p.read_text(),filename=str(p))
          r=json.loads(pathlib.Path('custody/dv/generated/result.json').read_text())
          assert r['31']['physical_correctors']==352 and r['31']['proposal_eigenvalue']>0
          assert r['31']['best']['lower']=='-3/1250' and not r['31']['best']['positive']
          PY
      - name: Authenticate frozen DV inputs
        run: (cd custody/dv/generated && sha256sum -c sha256.txt)
      - name: Install numerical environment
        run: |
          mkdir -p custody/dx/generated
          python -m pip install numpy==2.3.5
          python --version > custody/dx/generated/python-version.txt
          python -m pip freeze > custody/dx/generated/pip-freeze.txt
      - name: Regularized response screen (numerical only)
        run: python custody/dx/screen.py | tee custody/dx/generated/screen.log
      - name: Permanent evidence
        if: always()
        run: |
          mkdir -p custody/dx/generated
          (cd custody/dx/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-dx-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/dx/generated/
          git commit -m "DX numerical screen evidence run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1d-dx-evidence
          path: custody/dx/generated/
          retention-days: 90
