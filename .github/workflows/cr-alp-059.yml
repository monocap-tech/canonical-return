name: CR-ALP-059 global second moment
on:
  pull_request:
    paths:
      - 'src/audits/cr_alp_059/**'
      - '.github/workflows/cr-alp-059.yml'
  push:
    branches:
      - 'research/cr-alp-001-ramp-gram-dictionary'
    paths:
      - '.github/workflows/cr-alp-059.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sector: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install arithmetic libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev
      - name: Reconstruct and check frozen archive
        run: |
          mkdir -p /tmp/cr-alp059
          python3 src/audits/cr_alp_058_archive/reassemble.py /tmp/cr-alp059/package.zip
          python3 -m zipfile -e /tmp/cr-alp059/package.zip /tmp/cr-alp059
          cd /tmp/cr-alp059/cr_alp_058
          sha256sum -c SHA256SUMS
          python3 validate_geometry.py
          python3 check_saved.py
      - name: Exact second moment mesh and compile
        run: |
          python3 src/audits/cr_alp_059/mesh_second.py /tmp/cr-alp059
          g++ -O2 -std=gnu++17 -I/tmp/cr-alp059/cr_alp_058 src/audits/cr_alp_059/second.cpp -o /tmp/cr-alp059/second -lquadmath -l:libmpfr.so.6 -lgmp
      - name: Global physical integration
        env:
          K: ${{ matrix.sector }}
        run: |
          set -o pipefail
          /tmp/cr-alp059/second "/tmp/cr-alp059/cr_alp_058/input_$K.txt" /tmp/cr-alp059/cr_alp_058/mesh.txt /tmp/cr-alp059/cr_alp_058/gauss.txt /tmp/cr-alp059/cr_alp_058/second_mesh.txt | tee "/tmp/cr-alp059/second_$K.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr-alp059-sector-${{ matrix.sector }}
          path: /tmp/cr-alp059/second_*.log
          if-no-files-found: warn
  endpoints:
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cr-alp059-sector-*
          merge-multiple: true
          path: /tmp/cr-alp059
      - name: Independent rational transport
        run: |
          python3 src/audits/cr_alp_058_archive/reassemble.py /tmp/cr-alp059/package.zip
          python3 -m zipfile -e /tmp/cr-alp059/package.zip /tmp/cr-alp059
          python3 src/audits/cr_alp_059/check_second.py /tmp/cr-alp059 /tmp/cr-alp059
          cat /tmp/cr-alp059/second_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: cr-alp059-endpoints
          path: /tmp/cr-alp059/second_result.json
