name: W02 INT recover finer positive comparison
on:
  push:
    branches: [research/cr-int-t1d-ep-targeted-corrector-staged]
    paths: [.github/workflows/t1d-w02-int-finer-recover.yml]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            custody/w02-int/audits
      - uses: actions/checkout@v4
        with:
          ref: a4b63576f4a617c42975fdae85898fd1842739d6
          path: receiver-evidence
          sparse-checkout: |
            custody/w02-int/frozen-receiver/500
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Authenticate original completed output and independently replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install numpy==2.3.5
          mkdir -p custody/w02-int/finer-recovered
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/15232704938/zip > /tmp/finer.zip
          echo 'cca2670fc5cf48a030fa44d3d3dc1461ec3f3f4510c60ec738da91e7ac8afd0a  /tmp/finer.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          from fractions import Fraction
          import hashlib,json,zipfile
          p=Path('custody/w02-int/finer-recovered')
          names=('result.json','comparison.npz','bn_energy.py','inverse-proposal.npz','replay.log')
          def sha(b): return hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/finer.zip') as z:
              assert z.testzip() is None
              payload={}
              for n in names:
                  hits=[i for i in z.namelist() if Path(i).name==n]
                  assert len(hits)==1,(n,hits)
                  payload[n]=z.read(hits[0])
          r=json.loads(payload['result.json'])
          assert r['status']=='PASS' and r['source_commit']=='b2581fabb3e7c8d83b0fb21ac4b19629049af9e8'
          assert r['receiver_evidence']=='a4b63576f4a617c42975fdae85898fd1842739d6'
          assert r['comparison']['exact_ldl_positive'] is True
          assert Fraction(r['comparison']['lower'])==Fraction(143829187,10**14)
          assert sha(payload['comparison.npz'])==r['comparison']['output_sha256']
          assert sha(payload['inverse-proposal.npz'])==r['sampled_proposal']['response_sha256']
          assert sha(payload['bn_energy.py'])=='11f2e6aadec7f1997366b50a081bd49e80a4f368b478c41bbec740d629190efa'
          assert b'PASS strict positivity lower 143829187/100000000000000' in payload['replay.log']
          files={}
          for n,b in payload.items():
              if n!='inverse-proposal.npz':
                  (p/n).write_bytes(b)
                  files[n]={'sha256':sha(b),'bytes':len(b)}
          q=payload['inverse-proposal.npz'];parts=[]
          for i,a in enumerate(range(0,len(q),2*1024*1024)):
              b=q[a:a+2*1024*1024];n=f'inverse-proposal.part{i:03d}'
              (p/n).write_bytes(b);parts.append({'name':n,'sha256':sha(b),'bytes':len(b)})
          assert b''.join((p/x['name']).read_bytes() for x in parts)==q
          (p/'recovery.json').write_text(json.dumps({'artifact_id':15232704938,'run_id':46070284350,'archive_sha256':'cca2670fc5cf48a030fa44d3d3dc1461ec3f3f4510c60ec738da91e7ac8afd0a','files':files,'response':{'name':'inverse-proposal.npz','sha256':sha(q),'bytes':len(q),'parts':parts},'status':'authenticated; remote custody requires all parts and final replay'},indent=2)+'\n')
          print(json.dumps(r['comparison'],indent=2))
          PY
          set -o pipefail
          python custody/w02-int/audits/continuous_inverse_acceptance.py receiver-evidence/custody/w02-int/frozen-receiver/500/receiver.npz custody/w02-int/finer-recovered/comparison.npz custody/w02-int/finer-recovered/result.json | tee custody/w02-int/finer-recovered/recovery-replay.log
      - name: Incremental evidence-only persistence and remote object verification
        run: |
          set -euo pipefail
          p=custody/w02-int/finer-recovered
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-w02-finer-recovered-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add --sparse -f "$p"/result.json "$p"/comparison.npz "$p"/bn_energy.py "$p"/replay.log "$p"/recovery-replay.log "$p"/recovery.json
          git commit -m "Authenticate and replay finer continuous positive comparison"
          git push origin "HEAD:refs/heads/$branch"
          for f in "$p"/inverse-proposal.part*; do
            git add --sparse -f "$f"
            git commit -m "Preserve frozen response chunk $(basename "$f")"
            git push origin "HEAD:refs/heads/$branch"
          done
          head=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$head" = "$remote"
          # Verify reconstructed response from committed blobs, not untracked files.
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('custody/w02-int/finer-recovered')
          r=json.loads((p/'recovery.json').read_text())
          def blob(n):return subprocess.check_output(['git','show','HEAD:'+str(p/n)])
          h=hashlib.sha256();size=0
          for item in r['response']['parts']:
              b=blob(item['name']);assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']
              h.update(b);size+=len(b)
          assert h.hexdigest()==r['response']['sha256'] and size==r['response']['bytes']
          for n,item in r['files'].items():
              b=blob(n);assert len(b)==item['bytes'] and hashlib.sha256(b).hexdigest()==item['sha256']
          assert b'PASS strict positivity' in blob('recovery-replay.log')
          (p/'custody.json').write_text(json.dumps({'status':'PASS','verified_payload_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'response_sha256':h.hexdigest(),'response_bytes':size,'parts':len(r['response']['parts']),'scope':'all committed blobs authenticated; independent exact arithmetic replay PASS; inherited analytical hypotheses unchanged'},indent=2)+'\n')
          PY
          git add --sparse -f "$p/custody.json"
          git commit -m "Record complete frozen response custody and replay"
          git push origin "HEAD:refs/heads/$branch"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w02-int-finer-recovered
          path: custody/w02-int/finer-recovered/
