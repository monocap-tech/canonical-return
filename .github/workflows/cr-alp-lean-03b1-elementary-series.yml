name: CR-ALP LEAN-03B1 elementary analytic series and reductions
on:
  push:
    branches: ['research/cr-alp-122-fixed-collar-transfer-staged']
    paths: ['.github/workflows/cr-alp-lean-03b1-elementary-series.yml']
permissions:
  contents: write
concurrency:
  group: cr-alp-lean-03b1-elementary-series
  cancel-in-progress: false
jobs:
  analytic-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate accepted finite receipts and literal analytic source
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/alp03b1-evidence"
          P="$RUNNER_TEMP/alp03b1-project"
          mkdir -p "$E" "$P"
          {
            git rev-parse HEAD
            test "$(git hash-object custody/cr-alp-lean-02b2-complete-matrices/run-46092426583-attempt-1/receipts.json)" = f204e0a7b516d726717eaf59ca3986d64405f655
            test "$(git hash-object src/audits/cr_alp_046_full_finite.py)" = 554e7ab54da4545987d89aa660a4abe6c951cb63
            test "$(git hash-object src/audits/cr_alp_123av_elementary_remainder_guards.js)" = 9f9793525d4b52e98b2f0456a7588d440f837788
            test "$(git hash-object custody/cr-alp-123av-elementary-guards/result.json)" = 1268d87f67bc601001c8416ec64f5f03e768f832
            test "$(git hash-object formalization/cr-alp/AnalyticGuards.lean)" = b90973adab348c0e673880c3e436f359ed034673
            test "$(git hash-object formalization/cr-alp/DirectedInterval.lean)" = b7efa01d7560f80e9bce521b2d52c02ef21488c7
            test "$(git hash-object custody/cr-alp-lean-03a-analytic-guards/run-46094742420-attempt-1/receipts.json)" = 4e049f4b520c0c6647516717ea81b44dfa2a6e6e
            test "$(git hash-object formalization/cr-alp/ElementarySeries.lean)" = 83de1c6e58a807475af939356cb8da8104f6860b
            test "$(git hash-object formalization/cr-alp/TrigSeries.lean)" = d31df9a5fa2c8475b2ce793f8fd378cd74c8856d
            python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('custody/cr-alp-lean-02b2-complete-matrices/run-46092426583-attempt-1/receipts.json')
          r=json.loads(p.read_text())
          assert r['status']=='NATIVE_SIX_MATRICES_PASS' and r['kernel_entries']==10839 and not r['missing'] and not r['issues']
          a=json.loads(Path('custody/cr-alp-lean-03a-analytic-guards/run-46094742420-attempt-1/receipts.json').read_text())
          assert a['status']=='NATIVE_ANALYTIC_GUARD_RECEIVERS_PASS'
          for mod,count in [('ElementarySeries',15),('TrigSeries',6)]:
              t=Path('formalization/cr-alp/'+mod+'.lean').read_text()
              assert not re.search(r'\b(?:sorry|admit|sorryAx|axiom|native_decide)\b',t)
              assert len(re.findall(r'(?m)^#print axioms ',t))==count
          print('Accepted finite matrix custody and analytic source pins PASS')
          PY
          } 2>&1 | tee "$E/preflight.log"
          cp formalization/cr-alp/{AnalyticGuards,ElementarySeries,TrigSeries}.lean "$P/"
          cp "$P/"*.lean "$E/"
          cp custody/cr-alp-lean-02ar2-matrix-soundness/{lean-toolchain,lakefile.toml,lake-manifest.json} "$P/"
          cp "$P/"{lean-toolchain,lakefile.toml,lake-manifest.json} "$E/"
          printf '%s\n' "$GITHUB_SHA" > "$E/source-head.txt"
      - name: Install pinned Lean and Mathlib
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/alp03b1-project"
          E="$RUNNER_TEMP/alp03b1-evidence"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$P"
          { lean --version; lake --version; lake exe cache get; } 2>&1 | tee "$E/setup.log"
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 5ed2965256430c3649e86755f9576b54eca72435
          git -C .lake/packages/mathlib rev-parse HEAD > "$E/mathlib-commit.txt"
      - name: Compile accepted guard module and independent elementary proofs
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/alp03b1-project"
          E="$RUNNER_TEMP/alp03b1-evidence"
          cd "$P"
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/AnalyticGuards.olean AnalyticGuards.lean 2>&1 | tee "$E/guard-build.log"
          test -s .lake/build/lib/lean/AnalyticGuards.olean
          sha256sum .lake/build/lib/lean/AnalyticGuards.olean > "$E/olean.sha256"
          for mod in ElementarySeries TrigSeries; do
            rc=0
            { time timeout 12m lake env lean -o ".lake/build/lib/lean/$mod.olean" "$mod.lean"; } 2>&1 | tee "$E/$mod.log" || rc=$?
            printf '%s\n' "$rc" > "$E/$mod.exit"
            if [ "$rc" = 0 ]; then
              test -s ".lake/build/lib/lean/$mod.olean"
              sha256sum ".lake/build/lib/lean/$mod.olean" >> "$E/olean.sha256"
            fi
          done
      - name: Audit all named declarations and classify acceptance
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/alp03b1-evidence"
          python3 - "$E" <<'PY'
          import json,re,sys
          from pathlib import Path
          p=Path(sys.argv[1]);allowed={'propext','Classical.choice','Quot.sound'}
          modules={}; all_ok=True
          for mod,count in [('ElementarySeries',15),('TrigSeries',6)]:
              src=(p/(mod+'.lean')).read_text()
              names=re.findall(r'(?m)^#print axioms ([\w.]+)$',src)
              assert len(names)==count and len(set(names))==count
              rc=int((p/(mod+'.exit')).read_text())
              log=(p/(mod+'.log')).read_text()
              found={};issues=[]
              if rc!=0:issues.append('compiler exit '+str(rc))
              if re.search(r'(?m)^\s*(?:error:|.*: error:)',log):issues.append('compiler error')
              for name in names:
                  hits=list(re.finditer(r"^'"+re.escape(name)+r"' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)\s*$",log,re.M))
                  if len(hits)!=1:
                      issues.append(name+': missing or duplicate audit');continue
                  ax={a.strip() for a in (hits[0].group(1) or '').split(',') if a.strip()}
                  if not ax<=allowed:issues.append(name+': forbidden axiom '+str(sorted(ax-allowed)))
                  else:found[name]=sorted(ax)
              ok=not issues and len(found)==count
              modules[mod]={'status':'PASS' if ok else 'FAIL','expected':count,'declarations':found,'issues':issues}
              all_ok=all_ok and ok
          (p/'receipts.json').write_text(json.dumps({'status':'NATIVE_ELEMENTARY_SERIES_PASS' if all_ok else 'PARTIAL_OR_FAILED','source_head':(p/'source-head.txt').read_text().strip(),'modules':modules,'scope':'Elementary log, arctan, exp, sin and cos truncation and range reduction candidates; actual directed evaluation traces, digamma/trigamma, physical coefficient attachment and infinite-dimensional estimates remain separate.'},indent=2)+'\n')
          print('Elementary series module disposition:',{k:v['status'] for k,v in modules.items()})
          PY
      - name: Seal evidence
        if: always()
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/alp03b1-evidence"
          mkdir -p "$E"
          printf 'source=%s\njob_status=%s\n' "$GITHUB_SHA" "${{ job.status }}" > "$E/attempt.txt"
          cd "$E"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr-alp-lean03b1-elementary-series
          path: ${{ runner.temp }}/alp03b1-evidence/
          if-no-files-found: error
      - name: Preserve remote evidence, then enforce native acceptance
        if: always()
        run: |
          set -euo pipefail
          ROOT="custody/cr-alp-lean-03b1-elementary-series/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          test ! -e "$ROOT"
          mkdir -p "$ROOT"
          cp -a "$RUNNER_TEMP/alp03b1-evidence/." "$ROOT/"
          (cd "$ROOT"; sha256sum -c SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add "$ROOT"
          git commit -m 'CR-ALP LEAN-03B1: preserve native elementary series evidence [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          REMOTE="$(mktemp -d)"
          git archive FETCH_HEAD "$ROOT" | tar -x -C "$REMOTE"
          (cd "$REMOTE/$ROOT"; sha256sum -c SHA256SUMS)
          echo 'Remote native evidence readback PASS'
          python3 - "$ROOT/receipts.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]));assert r['status']=='NATIVE_ELEMENTARY_SERIES_PASS',r['status']
          PY
