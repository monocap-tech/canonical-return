name: T1D EJ independent extended terminal audit
on:
  push:
    branches: [research/cr-int-t1d-ej-extended-terminal-audit-active]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify independent source and evidence
        run: |
          python -m py_compile custody/ej/audit.py
          for stage in eg eh ei; do (cd custody/$stage/generated && sha256sum -c sha256.txt); done
          python -m pip install numpy==2.3.5
      - name: Independent synthesis and terminal matrix audit
        run: python custody/ej/audit.py
      - name: Permanent evidence
        if: always()
        run: |
          mkdir -p custody/ej/generated
          (cd custody/ej/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-ej-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/ej/generated/
          if git diff --cached --quiet; then
            echo 'No new audit evidence to commit'
          else
            git commit -m "EJ independent terminal audit evidence run ${GITHUB_RUN_ID}"
          fi
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1d-ej-evidence
          path: custody/ej/generated/
          retention-days: 90
