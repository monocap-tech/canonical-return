name: CR-ALP-067 locate submitted response run
on:
  pull_request:
    paths:
      - '.github/workflows/cr-alp-067-locate.yml'
permissions:
  actions: read
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate pinned push run without resubmitting integrations
        run: |
          gh api --method GET 'repos/monocap-tech/canonical-return/actions/runs' -f head_sha=d69bb0485c9389d8e5af40621fa2704ad0ebffed -f event=push --jq '.workflow_runs[] | {id,name,path,status,conclusion,head_sha,html_url}'
