name: T1D ED independent EC witness arithmetic audit
on:
  push:
    branches: [research/cr-int-t1d-ed-ec-witness-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Authenticate permanent inputs
        run: |
          for s in dv dx dy dz eb ec; do (cd custody/$s/generated && sha256sum -c sha256.txt); done
      - name: Independent witness reconstruction and sensitivity
        run: |
          python -m py_compile custody/ed/audit.py
          python custody/ed/audit.py
      - name: Permanent audit evidence
        if: always()
        run: |
          mkdir -p custody/ed/generated
          (cd custody/ed/generated && find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256.txt && sha256sum -c sha256.txt)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="research/cr-int-t1d-ed-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -f custody/ed/generated/
          git commit -m "ED witness audit evidence run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1d-ed-evidence
          path: custody/ed/generated/
          retention-days: 90
